  - Project
  - Domain
  - Subdomain
  - BoundedContext
  - Feature
  - Requirement
  - Component
  - Service
  - Module
  - Package
  - Class
  - Interface
  - API
  - Endpoint
  - Event
  - Topic
  - Queue
  - Database
  - Table
  - Collection
  - Cache
  - ExternalSystem
  - Dependency
  - Deployment
  - Container
  - KubernetesResource
  - Test
  - ADR
  - Risk
  - Vulnerability
  - Pattern
  - AntiPattern
  - Principle
  - Technology
  - Framework
  - Library
  - Agent
  - Task
  - Artifact
  - QualityAttribute
  - Policy

relation_types:
  - CONTAINS
  - BELONGS_TO
  - DEPENDS_ON
  - CALLS
  - READS_FROM
  - WRITES_TO
  - PUBLISHES
  - CONSUMES
  - IMPLEMENTS
  - SATISFIES
  - TESTED_BY
  - DEPLOYED_ON
