  - DISCOVERED_FROM_CODEBASE
  - DISCOVERED_FROM_CONFIG
  - DISCOVERED_FROM_SPEC
  - DISCOVERED_FROM_ADR
  - DISCOVERED_FROM_TEST
  - INFERRED
  - GENERATED
  - USER_CONFIRMED
  - UNRESOLVED

confidence_levels:
  deterministic: 1.00
  project_evidence: 0.90
  strong_inference_min: 0.70
  hypothesis_min: 0.50
  unresolved_max: 0.49
